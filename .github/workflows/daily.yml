name: daily
on:
  schedule:
    - cron: "40 12 * * 1-5" # 8:40 ET during EDT
    - cron: "40 13 * * 1-5" # 8:40 ET during EST
    # Backups: GitHub's cron slip grew to a 4-5.5h weekly median by 2026-09
    # (it was ~45 min in mid-August), and on 2026-08-28 every firing landed
    # past the old 15:59 ET cutoff. The gate (pipeline/publish_gate.py) now
    # publishes 8:00-21:59 ET and dedupes, so extra firings are cheap no-ops.
    - cron: "10 15 * * 1-5"
    - cron: "40 17 * * 1-5"
  # External scheduler (no cron slip): POST /repos/{owner}/{repo}/dispatches
  # with {"event_type":"daily"} from a fine-grained token scoped to this repo.
  # Gated exactly like schedule; workflow_dispatch stays ungated for humans.
  repository_dispatch:
    types: [daily]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The once-per-day gate must see every commit made today, even on an
          # unusually busy branch.
          fetch-depth: 0
      - name: Gate — scheduled runs publish once per day, 8:00-21:59 ET
        id: gate
        run: |
          # A queued run's checkout is pinned to the commit that existed when
          # the run was created; fast-forward so the already-published check
          # and the release-day guard see today's publish and today's store.
          git fetch -q origin main
          git merge -q --ff-only origin/main
          python3 -m pipeline.publish_gate --event "${{ github.event_name }}" \
            --store store | tee gate.log
          grep '^run=' gate.log >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Run pipeline
        if: steps.gate.outputs.run == 'true'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          python -m pip install --require-hashes -r requirements.lock -q
          python -m pipeline.run_daily --store store --out site/public/data
      - name: Commit data back
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "macrogauge-bot"
          # Vercel (Hobby) blocks deploys for commits whose author email doesn't
          # match a GitHub account — use the owner's noreply address.
          git config user.email "35318463+ewyluda@users.noreply.github.com"
          git add store site/public/data
          # published_at advances every run, so a successful run always commits —
          # the daily commit is the loop's heartbeat. The guard is only a safety
          # net for a pipeline step that wrote nothing.
          if git diff --cached --quiet; then
            echo "nothing staged — pipeline wrote no artifacts?"
          else
            git commit -m "data: daily publish $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
            # A human merge can land during this run. Rebase the data commit
            # onto the latest main and retry if main advances again between
            # the pull and push. Rebase conflicts remain fatal: generated data
            # must never be resolved by guessing in automation.
            for attempt in 1 2 3; do
              echo "publish attempt $attempt/3"
              if ! git pull --rebase origin main; then
                if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                  git rebase --abort || true
                  echo "::error::daily data commit conflicts with origin/main"
                else
                  echo "::error::git pull --rebase failed before rebasing (network/auth?)"
                fi
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "origin/main advanced during publish attempt $attempt"
            done
            echo "::error::daily data push rejected after 3 attempts"
            exit 1
          fi
      - name: Fail the run on a critical QA check
        # Data is already published above (isolation contract); this only turns
        # the run red so GitHub's failure email fires.
        if: steps.gate.outputs.run == 'true'
        run: python -m pipeline.watchdog --skip-publish-check
