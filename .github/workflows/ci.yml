name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Daily data commits are pushed with the workflow token, which never
  # triggers other workflows — so without this the committed data was never
  # built or e2e-tested before Vercel deployed it (last CI run on a data
  # commit: 2026-09-11). Runs against main's head after each publish.
  workflow_run:
    workflows: [daily]
    types: [completed]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock -q
      - run: pytest -q

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run lint
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npm run e2e
        working-directory: site
